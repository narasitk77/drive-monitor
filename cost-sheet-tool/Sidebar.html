<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    /* ── Reset & Base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', sans-serif; font-size: 13px; color: #212529; background: #f4f5f7; overflow-x: hidden; }

    /* ── Sticky Header ────────────────────────────────────── */
    .top-bar { background: #1a1a2e; color: #fff; padding: 11px 14px; position: sticky; top: 0; z-index: 100; }
    .top-bar h1 { font-size: 14px; font-weight: 700; letter-spacing: 0.3px; }
    .top-bar small { font-size: 10px; color: #9ba4b4; display: block; margin-top: 2px; }

    /* ── Sections ─────────────────────────────────────────── */
    .card { background: #fff; margin: 8px; border-radius: 5px; border: 1px solid #dee2e6; overflow: hidden; }
    .card-head { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; background: #f1f3f5; border-bottom: 1px solid #dee2e6; font-weight: 700; font-size: 11px; color: #495057; text-transform: uppercase; letter-spacing: 0.5px; }
    .card-body { padding: 10px 12px; }

    /* ── Form elements ────────────────────────────────────── */
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .fgroup { display: flex; flex-direction: column; gap: 3px; }
    .fgroup.full { grid-column: 1 / -1; }
    label { font-size: 10px; font-weight: 700; color: #6c757d; text-transform: uppercase; letter-spacing: 0.4px; }
    input, select { border: 1px solid #ced4da; border-radius: 3px; padding: 5px 8px; font-size: 12px; width: 100%; font-family: inherit; background: #fff; }
    input:focus, select:focus { outline: none; border-color: #3d7de0; box-shadow: 0 0 0 2px rgba(61,125,224,.18); }

    /* ── Tier Selector ────────────────────────────────────── */
    .tier-row { display: flex; gap: 6px; margin-top: 4px; }
    .tier-btn { flex: 1; padding: 9px 4px; border: 2px solid #dee2e6; border-radius: 5px; cursor: pointer; text-align: center; font-weight: 800; font-size: 18px; background: #fff; transition: all .15s; line-height: 1; }
    .tier-btn span { display: block; font-size: 9px; font-weight: 500; color: #868e96; margin-top: 3px; line-height: 1.3; }
    .tier-btn:hover { border-color: #adb5bd; }
    .tier-A { background: #1e0b36 !important; border-color: #1e0b36 !important; color: #fff !important; }
    .tier-A span { color: #c9b5e8 !important; }
    .tier-B { background: #0d3b6e !important; border-color: #0d3b6e !important; color: #fff !important; }
    .tier-B span { color: #9fc5ee !important; }
    .tier-C { background: #1e3a1e !important; border-color: #1e3a1e !important; color: #fff !important; }
    .tier-C span { color: #9fd49f !important; }

    /* ── Tables ───────────────────────────────────────────── */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th { background: #f1f3f5; padding: 5px 5px; text-align: left; font-weight: 700; color: #495057; border-bottom: 2px solid #dee2e6; white-space: nowrap; }
    td { padding: 4px 4px; border-bottom: 1px solid #f4f5f7; vertical-align: top; }
    td input, td select { padding: 3px 5px; font-size: 11px; border-color: #e0e0e0; }
    tr:last-child td { border-bottom: none; }

    /* ── Rate chips ───────────────────────────────────────── */
    .chips { display: flex; gap: 3px; margin-top: 3px; flex-wrap: wrap; }
    .chip { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 10px; cursor: pointer; border: 1px solid; transition: all .1s; white-space: nowrap; }
    .chip-med  { background: #e8f4fd; color: #0d6efd; border-color: #b8daff; }
    .chip-med:hover  { background: #0d6efd; color: #fff; }
    .chip-p75  { background: #fff3cd; color: #856404; border-color: #ffc107; }
    .chip-p75:hover  { background: #856404; color: #fff; }

    /* ── Buttons ──────────────────────────────────────────── */
    .btn        { padding: 5px 12px; border-radius: 3px; border: none; cursor: pointer; font-size: 12px; font-family: inherit; font-weight: 600; }
    .btn-xs     { padding: 2px 8px; font-size: 10px; }
    .btn-blue   { background: #0d6efd; color: #fff; }
    .btn-blue:hover { background: #0b5ed7; }
    .btn-red    { background: #dc3545; color: #fff; }
    .btn-red:hover  { background: #b02a37; }
    .add-btn    { width: 100%; margin-top: 6px; padding: 5px; border: 1px dashed #0d6efd; border-radius: 3px; background: #e8f4fd; color: #0d6efd; font-size: 11px; cursor: pointer; font-weight: 600; }
    .add-btn:hover  { background: #0d6efd; color: #fff; }
    .gen-btn    { width: calc(100% - 16px); margin: 8px; padding: 11px; font-size: 14px; background: #1e3a1e; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; font-family: inherit; }
    .gen-btn:hover  { background: #2d5a2d; }

    /* ── Status ───────────────────────────────────────────── */
    #loading { display: none; text-align: center; padding: 16px; color: #6c757d; font-size: 12px; }
    .spinner { border: 3px solid #dee2e6; border-top: 3px solid #0d6efd; border-radius: 50%; width: 22px; height: 22px; animation: spin .8s linear infinite; margin: 0 auto 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #result { display: none; margin: 8px; padding: 10px 12px; border-radius: 4px; font-size: 12px; }
    #result.ok  { background: #d1e7dd; border: 1px solid #a3cfbb; color: #0a3622; }
    #result.err { background: #f8d7da; border: 1px solid #f1aeb5; color: #58151c; }
    #result a   { color: inherit; font-weight: 700; }

    /* ── Misc ─────────────────────────────────────────────── */
    .no-col { width: 22px; color: #adb5bd; text-align: center; }
    .del-col { width: 26px; }
    .amt-col { width: 68px; }
    .qty-col { width: 42px; }
  </style>
</head>
<body>

<div class="top-bar">
  <h1>Cost Sheet Generator</h1>
  <small>Rate อ้างอิงจาก data จริง 2025–2026 · Gross ก่อน WHT 3%</small>
</div>

<!-- ─── Project Info ─────────────────────────────────────── -->
<div class="card">
  <div class="card-head">Project Info</div>
  <div class="card-body">
    <div class="row2">
      <div class="fgroup full">
        <label>Project Title *</label>
        <input id="title" type="text" placeholder="เช่น Bulgari x Orm Kornnaphat">
      </div>
    </div>
    <div class="row2">
      <div class="fgroup">
        <label>Starting Date</label>
        <input id="startDate" type="date">
      </div>
      <div class="fgroup">
        <label>Total Revenue (บาท, excl. VAT)</label>
        <input id="totalRevenue" type="number" placeholder="0" min="0">
      </div>
    </div>
    <div class="row2">
      <div class="fgroup">
        <label>Head Project / AE</label>
        <select id="ae"><option value="">— เลือก AE —</option></select>
      </div>
      <div class="fgroup">
        <label>Project Manager</label>
        <select id="pm"><option value="">— เลือก PM —</option></select>
      </div>
    </div>
    <div class="fgroup" style="margin-top:4px">
      <label>Tier / สเกลงาน</label>
      <div class="tier-row" id="tierRow">
        <button class="tier-btn" data-tier="A" onclick="selectTier('A')">A<span>Premium<br>Commercial</span></button>
        <button class="tier-btn" data-tier="B" onclick="selectTier('B')">B<span>Standard<br>Branded</span></button>
        <button class="tier-btn" data-tier="C" onclick="selectTier('C')">C<span>Editorial<br>Quick Clip</span></button>
      </div>
    </div>
  </div>
</div>

<!-- ─── Revenue Items ────────────────────────────────────── -->
<div class="card">
  <div class="card-head">
    Revenue Items
    <button class="btn btn-xs btn-blue" onclick="addRevRow()">+ เพิ่ม</button>
  </div>
  <div class="card-body" style="padding:8px">
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th class="no-col">#</th>
            <th style="min-width:90px">ประเภท</th>
            <th style="min-width:110px">Description</th>
            <th class="amt-col">Amount</th>
            <th style="min-width:100px">Outlets</th>
            <th class="del-col"></th>
          </tr>
        </thead>
        <tbody id="revBody"></tbody>
      </table>
    </div>
    <button class="add-btn" onclick="addRevRow()">+ เพิ่ม revenue item</button>
  </div>
</div>

<!-- ─── Cost Items ───────────────────────────────────────── -->
<div class="card">
  <div class="card-head">
    Cost Items (Outsource)
    <button class="btn btn-xs btn-blue" onclick="addCostRow()">+ เพิ่ม</button>
  </div>
  <div class="card-body" style="padding:8px">
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th class="no-col">#</th>
            <th style="min-width:120px">ตำแหน่ง / Category</th>
            <th style="min-width:90px">Description</th>
            <th class="qty-col">จำนวน</th>
            <th class="amt-col">Rate</th>
            <th class="amt-col">Total</th>
            <th class="del-col"></th>
          </tr>
        </thead>
        <tbody id="costBody"></tbody>
      </table>
    </div>
    <button class="add-btn" onclick="addCostRow()">+ เพิ่ม cost item</button>
  </div>
</div>

<!-- ─── Generate ─────────────────────────────────────────── -->
<div id="loading"><div class="spinner"></div>กำลังสร้าง Cost Sheet…</div>
<div id="result"></div>
<button class="gen-btn" id="genBtn" onclick="generate()">สร้าง Cost Sheet →</button>

<!-- ─────────────────────────────────────────────────────── -->
<script>
// ── State ───────────────────────────────────────────────────
let RATE_DATA = {};
let AE_LIST   = [];
let OUTLETS   = [];
let PRODUCT_TYPES = [];
let currentTier = 'B';
let revCnt = 0;
let costCnt = 0;

// All positions for cost category dropdown
const ALL_POSITIONS = [
  'Videographer (Outsource)',
  'Photographer (Outsource)',
  'Editor (Outsource)',
  'Colorist (Outsource)',
  'Sound Engineer (Outsource)',
  'Voice Over (Outsource)',
  'ค่าเช่าอุปกรณ์',
  'Production Design (Outsource)',
  'Location',
  'Catering (Outsource)',
  'Assistant Director (Outsource)',
  'ช่างแต่งหน้า',
  'Retouch Photo (Outsource)',
  'Creative (Outsource)',
  'ค่าทำซับ/แปลภาษา',
  'Food/Travelling cost',
  'Outsource cost - Others / Misc.',
  'Boostpost cost',
  'Printing cost',
  'Consumables cost',
];

// ── Init ────────────────────────────────────────────────────
window.onload = function() {
  document.getElementById('startDate').value = new Date().toISOString().split('T')[0];

  google.script.run
    .withSuccessHandler(function(d) {
      RATE_DATA     = d.rateData;
      AE_LIST       = d.aeList;
      OUTLETS       = d.outlets;
      PRODUCT_TYPES = d.productTypes;

      ['ae','pm'].forEach(id => {
        const sel = document.getElementById(id);
        AE_LIST.forEach(n => sel.add(new Option(n, n)));
      });

      selectTier('B');
      addRevRow();
      addCostRow();
    })
    .getDropdownData();
};

// ── Tier ────────────────────────────────────────────────────
function selectTier(t) {
  currentTier = t;
  document.querySelectorAll('.tier-btn').forEach(btn => {
    btn.className = 'tier-btn';
    if (btn.dataset.tier === t) btn.classList.add('tier-' + t);
  });
  // refresh chips for all existing cost rows
  document.querySelectorAll('.cost-cat').forEach(sel => refreshChips(sel));
}

// ── Revenue rows ────────────────────────────────────────────
function addRevRow() {
  revCnt++;
  const n = revCnt;
  const tbody = document.getElementById('revBody');
  const tr = document.createElement('tr');
  tr.id = 'rv-' + n;

  const typeOpts = PRODUCT_TYPES.map(p =>
    `<option value="${p.name}" data-code="${p.code}">${p.name}</option>`
  ).join('');
  const outOpts = OUTLETS.map(o => `<option value="${o}">${o}</option>`).join('');

  tr.innerHTML = `
    <td class="no-col">${n}</td>
    <td><select class="rv-type" style="width:100%">
      <option value="">เลือก</option>${typeOpts}
    </select></td>
    <td><input type="text" class="rv-desc" placeholder="รายละเอียด" style="width:100%"></td>
    <td><input type="number" class="rv-amt" placeholder="0" style="width:100%" min="0"></td>
    <td><select class="rv-out" style="width:100%">
      <option value="">เลือก</option>${outOpts}
    </select></td>
    <td><button class="btn btn-xs btn-red" onclick="delRow('rv-${n}', 'revBody')">×</button></td>
  `;
  tbody.appendChild(tr);
}

// ── Cost rows ────────────────────────────────────────────────
function addCostRow() {
  costCnt++;
  const n = costCnt;
  const tbody = document.getElementById('costBody');
  const tr = document.createElement('tr');
  tr.id = 'cs-' + n;
  tr.className = 'cost-row';

  const posOpts = ALL_POSITIONS.map(p => `<option value="${p}">${p}</option>`).join('');

  tr.innerHTML = `
    <td class="no-col">${n}</td>
    <td>
      <select class="cost-cat" style="width:100%; min-width:120px; font-size:10px"
        onchange="refreshChips(this)">
        <option value="">— เลือก —</option>${posOpts}
      </select>
      <div class="chips" id="chips-${n}"></div>
    </td>
    <td><input type="text" class="cost-desc" placeholder="รายละเอียด" style="width:100%; min-width:80px"></td>
    <td><input type="number" class="cost-qty" value="1" min="1" style="width:100%"
      oninput="calcTotal('cs-${n}')"></td>
    <td><input type="number" class="cost-rate" placeholder="0" style="width:100%"
      oninput="calcTotal('cs-${n}')"></td>
    <td><input type="number" class="cost-total" placeholder="0" style="width:100%; background:#f8f9fa; border-color:#e9ecef" readonly></td>
    <td><button class="btn btn-xs btn-red" onclick="delRow('cs-${n}', 'costBody')">×</button></td>
  `;
  tbody.appendChild(tr);
}

function refreshChips(sel) {
  const row = sel.closest('tr');
  if (!row) return;
  const n = row.id.replace('cs-', '');
  const chipsDiv = document.getElementById('chips-' + n);
  if (!chipsDiv) return;

  const cat = sel.value;
  const rd  = (RATE_DATA[currentTier] || {})[cat];

  if (rd) {
    chipsDiv.innerHTML =
      `<span class="chip chip-med" onclick="setRate('${row.id}', ${rd.median})"
        title="Median จาก data จริง (n=${rd.n})">
        Median ฿${rd.median.toLocaleString()}
      </span>
      <span class="chip chip-p75" onclick="setRate('${row.id}', ${rd.p75})"
        title="P75 — งบ buffer ปลอดภัย">
        P75 ฿${rd.p75.toLocaleString()}
      </span>`;
  } else {
    chipsDiv.innerHTML = '';
  }
}

function setRate(rowId, rate) {
  const row = document.getElementById(rowId);
  row.querySelector('.cost-rate').value = rate;
  calcTotal(rowId);
}

function calcTotal(rowId) {
  const row = document.getElementById(rowId);
  const qty  = parseFloat(row.querySelector('.cost-qty').value)  || 0;
  const rate = parseFloat(row.querySelector('.cost-rate').value) || 0;
  row.querySelector('.cost-total').value = qty * rate;
}

function delRow(id, tbodyId) {
  const el = document.getElementById(id);
  if (el) el.remove();
  renum(tbodyId, id.startsWith('rv') ? '.no-col' : '.no-col');
}

function renum(tbodyId) {
  document.querySelectorAll('#' + tbodyId + ' tr').forEach((tr, i) => {
    const nc = tr.querySelector('.no-col');
    if (nc) nc.textContent = i + 1;
  });
}

// ── Generate ─────────────────────────────────────────────────
function generate() {
  const title = document.getElementById('title').value.trim();
  if (!title) { alert('กรุณากรอก Project Title'); return; }

  // Collect revenue
  const revenueItems = [];
  document.querySelectorAll('#revBody tr').forEach((tr, i) => {
    const type   = tr.querySelector('.rv-type').value;
    const desc   = tr.querySelector('.rv-desc').value;
    const amount = parseFloat(tr.querySelector('.rv-amt').value) || 0;
    const outlets = tr.querySelector('.rv-out').value;
    if (type || desc || amount) {
      const pt = PRODUCT_TYPES.find(p => p.name === type);
      revenueItems.push({ no: i+1, type, description: desc, amount, outlets, itemCode: pt ? pt.code : '' });
    }
  });

  // Collect costs
  const costItems = [];
  document.querySelectorAll('#costBody tr').forEach((tr, i) => {
    const cat   = tr.querySelector('.cost-cat').value;
    const desc  = tr.querySelector('.cost-desc').value;
    const qty   = parseFloat(tr.querySelector('.cost-qty').value)  || 1;
    const rate  = parseFloat(tr.querySelector('.cost-rate').value) || 0;
    const total = parseFloat(tr.querySelector('.cost-total').value) || rate;
    if (cat || desc || rate) {
      costItems.push({ no: i+1, category: cat, description: desc, qty, rate, amount: total || rate, payment: 'จ่ายผ่านบัญชี' });
    }
  });

  const payload = {
    title,
    tier: currentTier,
    date: document.getElementById('startDate').value,
    ae:   document.getElementById('ae').value,
    pm:   document.getElementById('pm').value,
    totalRevenue: parseFloat(document.getElementById('totalRevenue').value) || 0,
    revenueItems,
    costItems,
  };

  // Show loading state
  document.getElementById('genBtn').style.display = 'none';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('result').style.display  = 'none';

  google.script.run
    .withSuccessHandler(function(res) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('genBtn').style.display  = 'block';
      const div = document.getElementById('result');
      if (res.success) {
        div.className = 'ok';
        div.innerHTML = `✓ สร้างสำเร็จ! <a href="${res.url}" target="_blank">${res.sheetName} →</a>`;
      } else {
        div.className = 'err';
        div.textContent = 'เกิดข้อผิดพลาด: ' + res.error;
      }
      div.style.display = 'block';
    })
    .withFailureHandler(function(err) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('genBtn').style.display  = 'block';
      const div = document.getElementById('result');
      div.className = 'err';
      div.textContent = 'Error: ' + err.message;
      div.style.display = 'block';
    })
    .generateCostSheet(payload);
}
</script>
</body>
</html>
